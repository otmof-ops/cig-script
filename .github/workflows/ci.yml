name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Run by hand to build the whole release matrix without publishing anything.
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every OS GitHub hosts, on both architectures where it offers them.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The box needs unprivileged user namespaces, which Ubuntu's AppArmor
      # restricts by default; the tests fall back and say so where it
      # cannot be lifted.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo test --workspace
      # Release inlining changes which frames a backtrace keeps, and the
      # crash tests read them: run the suite once as users run cig.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --release
      # The heavy tests (half a million and a million files) once, where
      # the disk is fast enough for them to be a measurement.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --test cli -- --ignored
      # The differential suite skips when its reference binary cannot be had; here it must run, so a
      # reference release that disappears fails the build instead of passing silently.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --test differential
        env:
          CIG_REQUIRE_DIFFERENTIAL: "1"
      - run: cargo run --release -- run examples/hello.cig -- ci
      - run: cargo run --release -- chains examples/tasks.cig
      # The benchmark gates (#145): every case's output is its expect file and
      # every unburn restores the exact bytes (correctness), and no kernel case
      # stores more than 10% above main's bytes per byte burned (disk). A trip
      # fails the pull request. The timing gates (regression, start-up) are
      # printed in the log and never fail it: a shared runner's clock is not a
      # gate (#153). One sample: the disk ratio is a count of bytes, not a time.
      - name: benchmark gates
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 30
        run: target/release/cig bench bench/bench.toml --samples 1 --gate correctness,disk
      # The portability probe: the kernel's promises checked on disk the way
      # a user would, one scenario each. A FAIL line fails the job.
      - name: portability probe
        if: runner.os != 'Windows'
        shell: bash
        run: |
          CIG="$PWD/target/release/cig" bash tests/portability/probe.sh | tee probe.txt
          ! grep -q '^FAIL' probe.txt
      - name: portability probe (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lines = pwsh -NoProfile -File tests/portability/probe.ps1 "$PWD\target\release\cig.exe"
          $lines
          if ($lines -match '^FAIL') { exit 1 }

  # musl, BusyBox, and root: the tests that lock a directory with chmod step
  # aside as root and say so.
  test-alpine:
    name: test (alpine, musl, as root)
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache bash curl gcc musl-dev python3 git nodejs procps strace
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - run: |
          . "$HOME/.cargo/env"
          cargo test --workspace
        # musl links mimalloc (#146): the mmap gate must run here, not skip
        env:
          CIG_REQUIRE_MMAP_GATE: "1"
      - run: |
          . "$HOME/.cargo/env"
          cargo build --release
          CIG="$PWD/target/release/cig" bash tests/portability/probe.sh | tee probe.txt
          ! grep -q '^FAIL' probe.txt

  # Passes across jobs (cig-script#186): one job checks the examples under
  # passes and exports them; the next verifies them against the first job's
  # key without checking again, and sees a changed example's pass stop
  # holding.
  passes-issue:
    name: passes (issue and export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: issue and export
        run: |
          export CIGSCRIPT_HOME="$RUNNER_TEMP/cig-a" CIG_SEAL_KEY=file
          mkdir -p passes
          target/release/cig run tests/ci/check-examples.cig > ids.txt
          while read -r name id; do
            target/release/cig pass export "$id" -o "passes/$name.pass"
          done < ids.txt
          target/release/cig pass key --kinds check > passes/allowed_signers
          ls passes
      - uses: actions/upload-artifact@v4
        with:
          name: passes
          path: passes/

  passes-verify:
    name: passes (verify in another job)
    needs: passes-issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/download-artifact@v4
        with:
          name: passes
          path: passes/
      - name: verify, then change an example
        run: |
          export CIGSCRIPT_HOME="$RUNNER_TEMP/cig-b" CIG_SEAL_KEY=file
          chmod 600 passes/allowed_signers
          for p in passes/*.pass; do
            target/release/cig pass verify "$p" --allowed-signers passes/allowed_signers
          done
          echo '# changed in this job' >> examples/hello.cig
          if target/release/cig pass verify passes/hello.pass --allowed-signers passes/allowed_signers; then
            echo "a changed example's pass still held"; exit 1
          fi

  # cig-pass's verifier is the one place that decides "trusted": each fuzz
  # target runs for a minute on every push, after replaying the corpus.
  fuzz-cig-pass:
    name: fuzz (cig-pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - working-directory: crates/cig-pass
        run: |
          for t in decode verify attenuate; do
            mkdir -p fuzz/corpus/$t
            cp -n fuzz/corpus/decode/* fuzz/corpus/$t/ 2>/dev/null || true
            cargo +nightly fuzz run $t fuzz/corpus/$t -- -max_total_time=60
          done

  # No hosted runner: a VM. It must not hold a merge back when the VM itself
  # misbehaves, so its failure is reported, not fatal; the log says.
  test-freebsd:
    name: test (freebsd)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: pkg install -y rust bash python3 git
          run: |
            cargo test --workspace
            cargo build --release
            CIG="$PWD/target/release/cig" bash tests/portability/probe.sh | tee probe.txt
            ! grep -q '^FAIL' probe.txt

  reuse:
    name: licence headers (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  release:
    name: release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, reuse]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux assets are static musl builds, so they run on any glibc, on
          # Alpine, and on Android under Termux. The asset names match
          # update::asset_name (OS, then std::env::consts::ARCH).
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,       asset: linux-x86_64,     ext: "",     tool: cargo }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl,      asset: linux-aarch64,    ext: "",     tool: cargo }
          - { os: ubuntu-latest,    target: armv7-unknown-linux-musleabihf,  asset: linux-arm,        ext: "",     tool: cross }
          - { os: macos-latest,     target: aarch64-apple-darwin,            asset: macos-aarch64,    ext: "",     tool: cargo }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,             asset: macos-x86_64,     ext: "",     tool: cargo }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,          asset: windows-x86_64,   ext: ".exe", tool: cargo }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,         asset: windows-aarch64,  ext: ".exe", tool: cargo }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cross, for a target this runner cannot link itself
        if: matrix.tool == 'cross'
        run: cargo install cross --locked
      - name: musl C toolchain (mimalloc builds C on the musl targets, #146)
        if: matrix.tool == 'cargo' && contains(matrix.target, 'linux-musl')
        run: |
          # Canonical's names can stop resolving for hours (2026-11-11: the runner's mirror list and
          # archive.ubuntu.com alike, while public resolvers still answered). Each try is time-bound; after
          # a failed one apt goes to the main archive, and a name this runner cannot resolve is pinned in
          # /etc/hosts from DNS over HTTPS to 1.1.1.1, which needs no lookup. apt still checks signatures.
          for i in 1 2 3 4; do
            if timeout 300 sudo apt-get -o Acquire::Retries=3 update \
              && timeout 300 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends musl-tools; then
              break
            fi
            if [ "$i" -eq 4 ]; then exit 1; fi
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              if [ -f "$f" ] && grep -q 'mirror+file:' "$f"; then
                sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' "$f"
                echo "apt: $f now uses archive.ubuntu.com"
              fi
            done
            for h in archive.ubuntu.com security.ubuntu.com; do
              if ! getent hosts "$h" >/dev/null; then
                ip=$(curl -fsS --max-time 10 -H 'accept: application/dns-json' "https://1.1.1.1/dns-query?name=$h&type=A" \
                  | jq -r '[.Answer[]? | select(.type == 1) | .data][0] // empty' || true)
                if [ -n "$ip" ]; then
                  echo "$ip $h" | sudo tee -a /etc/hosts >/dev/null
                  echo "apt: $h pinned to $ip"
                fi
              fi
            done
            sleep $((i * 15))
          done
      - run: ${{ matrix.tool }} build --release --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - name: name and checksum the asset (matches update::asset_name)
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          name="cig-${ref}-${{ matrix.asset }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/cig${{ matrix.ext }}" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          cat "$name.sha256"
          file "$name" 2>/dev/null || true
      - name: keep the build (a dry run of the matrix)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: cig-${{ matrix.asset }}
          path: cig-*-${{ matrix.asset }}${{ matrix.ext }}*
      - name: attest the build (the humidor and install.sh check this with gh attestation verify)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: cig-${{ github.ref_name }}-${{ matrix.asset }}${{ matrix.ext }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            cig-*-${{ matrix.asset }}${{ matrix.ext }}
            cig-*-${{ matrix.asset }}${{ matrix.ext }}.sha256

  # The licence files go beside the assets once, from one job. When every
  # build uploaded them, two builds replacing the same asset at once failed
  # the release (v1.12.1: armv7 and aarch64-apple-darwin).
  release-notices:
    name: release (licence files)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, reuse]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The release body is the CHANGELOG's section for this tag, so the
      # page a reader lands on says what the release changes.
      - name: the release body is this tag's CHANGELOG section
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## " v " " { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-body.md
          test -s release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            LICENSE
            NOTICE
            THIRD-PARTY-NOTICES.md

  # FreeBSD has no hosted runner: a VM builds the asset natively. It must not
  # hold the other assets back, so a failure here is reported, not fatal.
  release-freebsd:
    name: release (x86_64-unknown-freebsd)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, reuse]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: build in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: pkg install -y rust
          run: |
            cargo build --release
            ref="$(echo "${GITHUB_REF_NAME:-dispatch}" | tr / -)"
            name="cig-${ref}-freebsd-x86_64"
            cp target/release/cig "$name"
            sha256 -q "$name" | awk -v n="$name" '{print $1 "  " n}' > "$name.sha256"
            cat "$name.sha256"
      - name: keep the build (a dry run of the matrix)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: cig-freebsd-x86_64
          path: cig-*-freebsd-x86_64*
      - name: attest the build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: cig-${{ github.ref_name }}-freebsd-x86_64
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            cig-*-freebsd-x86_64
            cig-*-freebsd-x86_64.sha256
