name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its earlier run. A push to main finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A docs-only change (docs/** and *.md where the job does not build or test docs) skips the heavy
  # jobs: the macOS/Windows/ARM test matrix, alpine, the passes rounds, the fuzz run and the
  # freebsd VM. The Linux `test` matrix entry still runs (cargo test exercises README/doc
  # examples), and `reuse` still runs because the licence headers cover docs too. One `ci-ok`
  # verdict always reports. Plain `git`, no third-party action.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
      test_oses: ${{ steps.filter.outputs.test_oses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: are any non-docs paths touched
        env:
          GH_EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          case "$GH_EVENT" in
            pull_request)
              base="$BASE_SHA"
              git fetch --no-tags --prune --depth=50 origin "+refs/heads/*:refs/remotes/origin/*" >/dev/null 2>&1 || true
              files=$(git diff --name-only "$base"...HEAD)
              ;;
            *)
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                files=$(git diff --name-only HEAD^ HEAD)
              else
                files=$(git ls-tree -r --name-only HEAD)
              fi
              ;;
          esac
          echo "changed files:"
          printf '%s\n' "$files"
          code_changed=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md) ;;
              *) code_changed=true; break ;;
            esac
          done <<EOF
          $files
          EOF
          if [ "$code_changed" = true ]; then
            test_oses='["ubuntu-latest","ubuntu-24.04-arm","macos-latest","macos-15-intel","windows-latest","windows-11-arm"]'
          else
            test_oses='["ubuntu-latest"]'
          fi
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "test_oses=$test_oses" >> "$GITHUB_OUTPUT"
          echo "code_changed=$code_changed"
          echo "test_oses=$test_oses"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_oses) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The box needs unprivileged user namespaces, which Ubuntu's AppArmor
      # restricts by default; the tests fall back and say so where it
      # cannot be lifted.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo test --workspace
      # Release inlining changes which frames a backtrace keeps, and the
      # crash tests read them: run the suite once as users run cig.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --release
      # The heavy tests (half a million and a million files) once, where
      # the disk is fast enough for them to be a measurement.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --test cli -- --ignored
      # The differential suite skips when its reference binary cannot be had; here it must run, so a
      # reference release that disappears fails the build instead of passing silently.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --test differential
        env:
          CIG_REQUIRE_DIFFERENTIAL: "1"
      - run: cargo run --release -- run examples/hello.cig -- ci
      - run: cargo run --release -- chains examples/tasks.cig
      # The benchmark gates (#145): every case's output is its expect file and
      # every unburn restores the exact bytes (correctness), and no kernel case
      # stores more than 10% above main's bytes per byte burned (disk). A trip
      # fails the pull request. The timing gates (regression, start-up) are
      # printed in the log and never fail it: a shared runner's clock is not a
      # gate (#153). One sample: the disk ratio is a count of bytes, not a time.
      - name: benchmark gates
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 30
        run: target/release/cig bench bench/bench.toml --samples 1 --gate correctness,disk
      # The portability probe: the kernel's promises checked on disk the way
      # a user would, one scenario each. A FAIL line fails the job.
      - name: portability probe
        if: runner.os != 'Windows'
        shell: bash
        run: |
          CIG="$PWD/target/release/cig" bash tests/portability/probe.sh | tee probe.txt
          ! grep -q '^FAIL' probe.txt
      - name: portability probe (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lines = pwsh -NoProfile -File tests/portability/probe.ps1 "$PWD\target\release\cig.exe"
          $lines
          if ($lines -match '^FAIL') { exit 1 }

  # musl, BusyBox, and root: the tests that lock a directory with chmod step
  # aside as root and say so.
  test-alpine:
    name: test (alpine, musl, as root)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache bash curl gcc musl-dev python3 git nodejs procps strace
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - run: |
          . "$HOME/.cargo/env"
          cargo test --workspace
        # musl links mimalloc (#146): the mmap gate must run here, not skip
        env:
          CIG_REQUIRE_MMAP_GATE: "1"
      - run: |
          . "$HOME/.cargo/env"
          cargo build --release
          CIG="$PWD/target/release/cig" bash tests/portability/probe.sh | tee probe.txt
          ! grep -q '^FAIL' probe.txt

  # Passes across jobs (cig-script#186): one job checks the examples under
  # passes and exports them; the next verifies them against the first job's
  # key without checking again, and sees a changed example's pass stop
  # holding.
  passes-issue:
    name: passes (issue and export)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --release
      - name: issue and export
        run: |
          export CIGSCRIPT_HOME="$RUNNER_TEMP/cig-a" CIG_SEAL_KEY=file
          mkdir -p passes
          target/release/cig run tests/ci/check-examples.cig > ids.txt
          while read -r name id; do
            target/release/cig pass export "$id" -o "passes/$name.pass"
          done < ids.txt
          target/release/cig pass key --kinds check > passes/allowed_signers
          ls passes
      - uses: actions/upload-artifact@v4
        with:
          name: passes
          path: passes/

  passes-verify:
    name: passes (verify in another job)
    needs: [changes, passes-issue]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --release
      - uses: actions/download-artifact@v4
        with:
          name: passes
          path: passes/
      - name: verify, then change an example
        run: |
          export CIGSCRIPT_HOME="$RUNNER_TEMP/cig-b" CIG_SEAL_KEY=file
          chmod 600 passes/allowed_signers
          for p in passes/*.pass; do
            target/release/cig pass verify "$p" --allowed-signers passes/allowed_signers
          done
          echo '# changed in this job' >> examples/hello.cig
          if target/release/cig pass verify passes/hello.pass --allowed-signers passes/allowed_signers; then
            echo "a changed example's pass still held"; exit 1
          fi

  # cig-pass's verifier is the one place that decides "trusted": each fuzz
  # target runs for a minute on every push, after replaying the corpus.
  fuzz-cig-pass:
    name: fuzz (cig-pass)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - working-directory: crates/cig-pass
        run: |
          for t in decode verify attenuate; do
            mkdir -p fuzz/corpus/$t
            cp -n fuzz/corpus/decode/* fuzz/corpus/$t/ 2>/dev/null || true
            cargo +nightly fuzz run $t fuzz/corpus/$t -- -max_total_time=60
          done

  # No hosted runner: a VM. It must not hold a merge back when the VM itself
  # misbehaves, so its failure is reported, not fatal; the log says.
  test-freebsd:
    name: test (freebsd)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: pkg install -y rust bash python3 git
          run: |
            cargo test --workspace
            cargo build --release
            CIG="$PWD/target/release/cig" bash tests/portability/probe.sh | tee probe.txt
            ! grep -q '^FAIL' probe.txt

  reuse:
    name: licence headers (REUSE)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  # The one verdict every pull request reports: did every needed job pass or skip.
  ci-ok:
    name: ci
    if: always()
    needs: [changes, test, test-alpine, passes-issue, passes-verify, fuzz-cig-pass, test-freebsd, reuse]
    runs-on: ubuntu-latest
    steps:
      - name: every needed job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS"
          # test-freebsd has continue-on-error: treat its result as advisory; everything else must
          # be success or skipped.
          failed=$(printf '%s' "$NEEDS" \
            | jq -r 'to_entries | map(select(.key != "test-freebsd" and .value.result != "success" and .value.result != "skipped")) | map(.key) | join(" ")')
          if [ -n "$failed" ]; then
            echo "::error::failed or cancelled: $failed"
            exit 1
          fi
          echo "every needed job passed or was skipped"
