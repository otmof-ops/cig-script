#
# The family's one benchmark workflow (#179 step 6). Every repository that has
# a `bench/bench.toml` calls it:
#
#   # .github/workflows/bench.yml in the calling repository
#   on:
#     pull_request:
#     schedule:
#       - cron: "17 2 * * *"
#     workflow_dispatch:
#   jobs:
#     bench:
#       uses: otmof-ops/cig-script/.github/workflows/bench.yml@main
#       with:
#         cig-version: "1.21.0"        # leave empty in cig-script itself: it builds its own cig
#         prepare: |                   # optional: what the suite needs beside cig
#           cargo build --release --locked --bin <product>
#           echo "$PWD/target/release" >> "$GITHUB_PATH"
#       permissions:                   # the calling job's grants are the only ones this workflow has
#         contents: write              # the nightly appends to the bench-history branch
#         pull-requests: write         # the PR comment
#
# Pull requests run the fast groups, A/B against the base branch on the same
# runner (interleaved), and comment the Markdown table. Nightly (a schedule or
# a manual run) runs the whole suite and appends one JSON line per run to
# `history/<product>.jsonl` on the `bench-history` branch, which
# `cig bench history <case>` reads. Heavy suites run nightly, never on a pull
# request.
#
# What fails a run: a case whose output is WRONG (`cig bench` exits 1), a gate
# named in `gate` that trips, or a suite that cannot be read or built. A timing
# never fails it: timings are reported, never gated, on shared runners (#153);
# the table says what moved and how sure the test is, and `cig bench --gate`
# prints every gate, failing only the ones `gate` names.
#
# The nightly filesystem matrix (.github/workflows/bench-nightly.yml, #145)
# calls this once per filesystem: `runs-on` picks the runner, `filesystem`
# (Linux: ext4, btrfs or xfs) makes that filesystem on a loop device and puts
# every sample's home on it, and `series` names the history file
# (`history/<product>.<series>.jsonl`, read with `cig bench history --series`).
name: bench

on:
  workflow_call:
    inputs:
      manifest:
        description: The suite, relative to the repository root.
        type: string
        default: bench/bench.toml
      mode:
        description: "pr, nightly, or auto (a schedule or workflow_dispatch is nightly, anything else is pr)."
        type: string
        default: auto
      fast-groups:
        description: Space-separated groups a pull request runs; the rest are nightly.
        type: string
        default: start-up compute
      cig-version:
        description: The cig release to measure with (sha256 checked). Empty builds cig from this repository.
        type: string
        default: ""
      history-branch:
        description: The branch the nightly appends to.
        type: string
        default: bench-history
      runs-on:
        description: The runner label.
        type: string
        default: ubuntu-latest
      filesystem:
        description: "Linux only: ext4, btrfs or xfs, formatted on a loop device on the runner and used for every sample's home. Empty uses the runner's own disk."
        type: string
        default: ""
      series:
        description: "Names the history file: history/<product>.<series>.jsonl. Empty is history/<product>.jsonl."
        type: string
        default: ""
      gate:
        description: "Gates that fail the run (cig bench --gate): correctness, disk, start-up, regression or all. The rest are printed."
        type: string
        default: correctness
      prepare:
        description: "Shell lines run from the repository root once cig is on PATH, before the suite: what it needs beside cig (a sibling checkout, the product's own build on GITHUB_PATH). A failing line fails the run."
        type: string
        default: ""

# No top-level `permissions:` here, on purpose. A called workflow can only lower
# what its caller grants, never raise it: a block here (even `contents: read`)
# turned the nightly callers' `contents: write` into read, and every push to the
# history branch was refused. Without one, this workflow runs with exactly what
# the calling job grants: write for the nightly, read for a pull request.

jobs:
  bench:
    name: bench (${{ inputs.mode }}${{ inputs.series && format(', {0}', inputs.series) || '' }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 120
    # One writer at a time to each series' history; the push below retries
    # when another series wrote the branch first.
    concurrency:
      group: bench-history-${{ github.repository }}-${{ inputs.series }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      GATE: ${{ inputs.gate }}
      FILESYSTEM: ${{ inputs.filesystem }}
      SERIES: ${{ inputs.series }}
      MANIFEST: ${{ inputs.manifest }}
      FAST_GROUPS: ${{ inputs.fast-groups }}
      CIG_VERSION: ${{ inputs.cig-version }}
      HISTORY_BRANCH: ${{ inputs.history-branch }}
      NO_COLOR: "1"
      CIG_DOCTOR: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide the mode
        id: mode
        run: |
          mode="${{ inputs.mode }}"
          if [ "$mode" = auto ]; then
            case "${{ github.event_name }}" in
              schedule|workflow_dispatch) mode="nightly" ;;
              *) mode="pr" ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
        if: inputs.cig-version == '' || inputs.prepare != ''

      - name: Build cig from this repository
        if: inputs.cig-version == ''
        run: |
          cargo build --release --locked
          bin="$PWD/target/release"
          # GITHUB_PATH wants a Windows path on Windows.
          if command -v cygpath > /dev/null; then bin="$(cygpath -w "$bin")"; fi
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install the cig release
        if: inputs.cig-version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          v="${CIG_VERSION#v}"
          asset="cig-v${v}-linux-x86_64"
          mkdir -p "$HOME/.cig-bench-bin"
          cd "$HOME/.cig-bench-bin"
          gh release download "v${v}" --repo otmof-ops/cig-script --pattern "${asset}" --pattern "${asset}.sha256"
          # Nothing runs until the checksum matches.
          want="$(awk '{print $1}' "${asset}.sha256")"
          have="$(sha256sum "${asset}" | awk '{print $1}')"
          [ "$want" = "$have" ] || { echo "sha256 of ${asset} does not match its checksum file"; exit 1; }
          mv "${asset}" cig
          chmod +x cig
          echo "$PWD" >> "$GITHUB_PATH"

      # The nightly matrix's Linux filesystems: a sparse image on the runner's
      # big temporary disk, formatted and mounted, and TMPDIR pointed at it, so
      # every sample's home (where the kernel cases write) is on that filesystem.
      - name: Make the filesystem
        if: inputs.filesystem != '' && runner.os == 'Linux'
        run: |
          set -eu
          case "$FILESYSTEM" in
            ext4) ;;
            btrfs) sudo apt-get install -y --no-install-recommends btrfs-progs ;;
            xfs) sudo apt-get install -y --no-install-recommends xfsprogs ;;
            *) echo "filesystem must be ext4, btrfs or xfs, not $FILESYSTEM"; exit 1 ;;
          esac
          img=/mnt/bench-fs.img
          sudo truncate -s 8G "$img"
          dev="$(sudo losetup --find --show "$img")"
          case "$FILESYSTEM" in
            ext4) sudo mkfs.ext4 -q -F "$dev" ;;
            btrfs) sudo mkfs.btrfs -q -f "$dev" ;;
            xfs) sudo mkfs.xfs -q -f "$dev" ;;
          esac
          mnt="$RUNNER_TEMP/bench-fs"
          sudo mkdir -p "$mnt"
          sudo mount "$dev" "$mnt"
          sudo chown "$(id -u):$(id -g)" "$mnt"
          got="$(findmnt -no FSTYPE "$mnt")"
          [ "$got" = "$FILESYSTEM" ] || { echo "mounted $got, wanted $FILESYSTEM"; exit 1; }
          echo "TMPDIR=$mnt" >> "$GITHUB_ENV"
          echo "FS_TYPE=$got" >> "$GITHUB_ENV"

      # Where the runner's own disk is the filesystem (macOS APFS, Windows
      # NTFS), say which it is; the history line carries it.
      - name: Record the filesystem
        if: inputs.filesystem == '' || runner.os != 'Linux'
        run: |
          # A probe may come back empty; it never fails the step. `diskutil info`
          # takes a device or a mount point, not a folder, so ask about the
          # volume the folder is on.
          fs=""
          case "$RUNNER_OS" in
            macOS)
              dev="$( { df -P "$RUNNER_TEMP" 2>/dev/null || true; } | awk 'NR==2 {print $1}')" || dev=""
              if [ -n "$dev" ]; then
                fs="$( { diskutil info "$dev" 2>/dev/null || true; } | awk -F: '/Type \(Bundle\)/ {gsub(/ /, "", $2); print $2}')" || fs=""
              fi ;;
            Windows) fs="$( { powershell -NoProfile -Command "(Get-Volume -DriveLetter ('$RUNNER_TEMP'.Substring(0,1))).FileSystem" 2>/dev/null || true; } | tr -d '\r')" || fs="" ;;
            *) fs="$(findmnt -no FSTYPE -T "$RUNNER_TEMP" 2>/dev/null || true)" ;;
          esac
          echo "FS_TYPE=${fs:-unknown}" >> "$GITHUB_ENV"
          echo "filesystem: ${fs:-unknown}"

      # The calling repository's own preparation, as it wrote it (its text
      # reaches bash through the environment, never through the expression).
      - name: Prepare the suite
        if: inputs.prepare != ''
        env:
          PREPARE: ${{ inputs.prepare }}
        run: bash -eu -c "$PREPARE"

      - name: Pull request, A/B against the base
        if: steps.mode.outputs.mode == 'pr'
        run: |
          set -u
          cig --version
          : > bench-report.md
          status=0
          for g in $FAST_GROUPS; do
            printf '### %s\n\n' "$g" >> bench-report.md
            # B is this checkout; A is the base, built in a worktree with [bench].build.
            cig bench "$MANIFEST" --group "$g" --against "origin/${{ github.base_ref }}" --markdown --gate "$GATE" >> bench-report.md || status=$?
            printf '\n' >> bench-report.md
          done
          cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_ENV"

      - name: Comment the table
        if: steps.mode.outputs.mode == 'pr' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file bench-report.md \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file bench-report.md

      - name: Fail on a wrong answer
        if: steps.mode.outputs.mode == 'pr'
        run: |
          # Exit 1 is a WRONG case or a case that could not be measured; exit 3
          # is a suite or a build that cannot be used. Slower is never a failure.
          [ "${status:-0}" = 0 ] || { echo "cig bench exited ${status}"; exit 1; }

      - name: Nightly, the whole suite
        if: steps.mode.outputs.mode == 'nightly'
        run: |
          set -u
          cig --version
          status=0
          cig --json bench "$MANIFEST" --gate "$GATE" > bench-run.json || status=$?
          echo "status=$status" >> "$GITHUB_ENV"
          # A run that gave no result (a usage error, a cig that does not
          # read this manifest) writes no history line: an empty line under
          # an empty name was pushed for one. The last step fails the job.
          product="$(jq -r '.product // empty' bench-run.json 2> /dev/null || true)"
          if [ -z "$product" ]; then
            echo "cig bench gave no result (exit ${status}); no history line is written"
            exit 0
          fi
          # One line per run: the format `cig bench history` reads.
          jq -c --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg commit "${{ github.sha }}" --arg fs "${FS_TYPE:-unknown}" --arg os "$RUNNER_OS" '
            { format: 1, at: $at, commit: $commit, product: .product, cig_version: .cig_version,
              filesystem: $fs, runner_os: $os,
              machine: "\(.conditions.cpu), \(.conditions.cores) cores, \(.conditions.os) \(.conditions.kernel)",
              cases: ( [ .cases[] | select(.outcome.state == "timed")
                         | { key: .name, value: { group: .group, median_ms: .outcome.median_ms,
                             p10_ms: .outcome.p10_ms, p90_ms: .outcome.p90_ms, cv: .outcome.cv,
                             rss_bytes: .outcome.rss_bytes } } ] | from_entries ) }' bench-run.json > bench-line.json
          # A run that timed no case (the product was not built, so nothing
          # could start) has nothing to compare: it writes no line either.
          if [ "$(jq '.cases | length' bench-line.json)" = 0 ]; then
            echo "cig bench timed no case (exit ${status}); no history line is written"
            exit 0
          fi
          echo "PRODUCT=$product" >> "$GITHUB_ENV"
          # One file per series (the nightly matrix: ext4, btrfs, xfs, apfs, ntfs).
          echo "HISTORY_FILE=${product}${SERIES:+.$SERIES}.jsonl" >> "$GITHUB_ENV"
          cat bench-line.json

      - name: Nightly, append to the history branch
        if: steps.mode.outputs.mode == 'nightly' && env.PRODUCT != ''
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            # Start every attempt clean: a failed push leaves the worktree's
            # entry and the local branch behind, and the next `checkout
            # --orphan` then stops with "a branch named ... already exists".
            rm -rf "$RUNNER_TEMP/hist"
            git worktree prune
            git branch -D "$HISTORY_BRANCH" > /dev/null 2>&1 || true
            if git ls-remote --exit-code --heads origin "$HISTORY_BRANCH" > /dev/null; then
              git fetch origin "$HISTORY_BRANCH"
              git worktree add "$RUNNER_TEMP/hist" "origin/$HISTORY_BRANCH"
              git -C "$RUNNER_TEMP/hist" checkout -B "$HISTORY_BRANCH"
            else
              git worktree add --detach "$RUNNER_TEMP/hist"
              git -C "$RUNNER_TEMP/hist" checkout --orphan "$HISTORY_BRANCH"
              git -C "$RUNNER_TEMP/hist" rm -rf . > /dev/null 2>&1 || true
            fi
            mkdir -p "$RUNNER_TEMP/hist/history"
            cat bench-line.json >> "$RUNNER_TEMP/hist/history/${HISTORY_FILE}"
            git -C "$RUNNER_TEMP/hist" add history
            git -C "$RUNNER_TEMP/hist" commit -m "bench: ${PRODUCT}${SERIES:+ ($SERIES)} ${{ github.sha }}"
            if git -C "$RUNNER_TEMP/hist" push origin "HEAD:$HISTORY_BRANCH"; then
              exit 0
            fi
            git worktree remove --force "$RUNNER_TEMP/hist" || true
            # The series of one nightly push to the same branch: wait a
            # different time each before trying again on the new tip.
            sleep $(( (RANDOM % 8) + attempt * 3 ))
          done
          echo "could not push to $HISTORY_BRANCH"
          exit 1

      - name: Nightly, fail on a wrong answer
        if: steps.mode.outputs.mode == 'nightly'
        run: |
          [ "${status:-0}" = 0 ] || { echo "cig bench exited ${status}"; exit 1; }
          [ -n "${PRODUCT:-}" ] || { echo "cig bench gave no result or timed no case, so nothing was recorded"; exit 1; }
