name: A cheat that worked
description: The kernel lied about what it can undo, lost a file, or said "aww yea" when it should have said no.
title: "cheat: "
labels: ["cheat"]
body:
  - type: markdown
    attributes:
      value: |
        Nobody's on trial. A good report has four things; the rest is optional.
        `ciginstaller bug cig` writes most of it up for you, redacted (home paths
        become `~`, secret-shaped values are removed, file contents are never
        included), and shows exactly what would be sent first; `cig report <run>`
        is the short way in for a run. Read it before you attach it.
  - type: textarea
    id: script
    attributes:
      label: The script
      description: The smallest script that still does it.
      render: cig
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: The command you ran
      placeholder: cig run --dry-run tidy.cig -- ~/Downloads
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: What the plan (or the run) said
      description: The dry-run plan, the receipt, the diagnostic, doctor's lines. Paste, don't summarise.
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: What you expected, what you found, and the run id from `cig runs`. Paste the output of `ciginstaller bug cig` (or `cig report <run>`) if you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ciginstaller status (or cig --version) and platform
      description: Paste the output of `ciginstaller status`; without the installer, `cig --version`.
      placeholder: cig 1.0.0, Linux x86_64
  - type: markdown
    attributes:
      value: |
        What you get back: a fix, a regression test named after the cheat, and a row on the wall.
