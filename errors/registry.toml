remedy = "the watch still works; to get the fast route run on a newer kernel or a container that allows it"
[[code.cause]]
why = "the hop is already traced, or the ptrace route is refused too (yama, a container), in which case a watched hop is refused rather than run unwatched (E777)"
probe = "none"
remedy = "allow ptrace of descendants (kernel.yama.ptrace_scope 1 is enough) or run where seccomp notification is available"

[[code]]
code = "E780"
title = "a layer was kept, not applied"
meaning = "The hop ran in the box and its layer was held back: apply: never asked for exactly that, or apply: ask found no terminal or a no. The changes are in the box under the run, not in the pack; cig box apply <run> <hop> puts them in as a run of their own, cig box discard drops them."
fix = "cig box list, then cig box apply <run> <hop> or cig box discard <run> <hop>"
no = "cant-see-any"
arises = ["run"]
tags = ["kernel"]
since = "1.11.0"
related = ["E763"]
[[code.cause]]
why = "the script asked for a rehearsal (apply: never), or asked and nobody was there to say yes"
probe = "none"
remedy = "apply or discard the kept layer by hand"

[[code]]
code = "E781"
title = "a hop changed what it was not expected to"
meaning = "A boxed hop with box.expect wrote, linked, replaced or removed something its expected footprint does not name, or left a link that leaves the pack, a set-id file, or a folder that cannot be read. The note lists the first few paths; the hop's result carries them all (outside). Under box.contain the layer is held back rather than applied."
fix = "read the paths: add one to box.expect if the tool meant it, or treat it as the finding it is"
no = "these-are-mine"
arises = ["run"]
tags = ["kernel"]
since = "1.12.0"
related = ["E780", "E771", "E782"]
[[code.cause]]
why = "the tool writes somewhere its footprint does not name yet (a new cache folder, a lockfile it updates), or code it runs is doing what it should not"
probe = "none"
remedy = "compare the path with the tool's documented footprint; widen box.expect only for what the tool itself does"

[[code]]
code = "E782"
title = "not a layer this run can apply"
meaning = "proc.apply_layer or proc.discard_layer was given something other than a layer this run kept, or the kept layer no longer holds exactly what it held when the hop was judged (something changed it in between), so applying it would apply what nobody judged."
fix = "pass the layer a boxed hop of this run returned; a layer that changed is not applied: run the hop again"
no = "cant-see-any"
arises = ["run"]
tags = ["kernel"]
since = "1.12.0"
related = ["E780", "E781"]
[[code.cause]]
why = "the layer belongs to another run, was applied or dropped already, or was changed after the hop was judged"
probe = "none"
remedy = "cig box list shows the kept layers; cig box apply <run> <hop> applies another run's"

[[code]]
code = "E715"
title = "debugging is allowed"
meaning = "CIG_ALLOW_DEBUG is set, so cig does not stop a debugger or another process of the same user from reading the tin's key out of its memory. This is for contributors debugging cig; cig says so on every run while it is set."
fix = "unset CIG_ALLOW_DEBUG"
no = "none"
arises = ["run", "any"]
tags = ["kernel"]
since = "1.8.0"
related = ["E707"]
[[code.cause]]
why = "CIG_ALLOW_DEBUG is set in the environment"
probe = "none"
remedy = "unset CIG_ALLOW_DEBUG when you are done debugging cig"

[[code]]
code = "E720"
title = "a rekey cannot be done"
meaning = "cig tin rekey refuses because what it needs is not here, is already in use, or would launder tampering. The current key must be available (otherwise there is nothing to re-seal from), and the keeper must be one a rekey can write to (keyring or key file). An interrupted earlier rekey that left behind a seal.key.old file that is not a key is also this code. The rekey takes an exclusive lock on the tin: a second cig tin rekey while one is held is refused outright, named. Every format-3 journal and the ledger are verified under the current key before anything is re-signed; a chain that does not fit refuses the rekey, naming the run, and leaves the tampered bytes on disk so they can be looked at. The keeper swap at the end is read back: a keeper that would not carry the new key refuses, leaves both stashes on disk (every sealed object stays readable under the fallback), and a later cig tin rekey finishes the job. Nothing on disk is changed before the walk begins."
fix = "put the current key back (cig tin key import), or store it where a rekey can swap it (cig config seal_key keyring); after a bad seal.key.old, move it aside and run cig tin rekey again; wait for the holder of the rekey lock; fix the tampered journal cig names before trying again"
no = "depends"
arises = ["run"]
tags = ["kernel"]
since = "1.19.0"
related = ["E703", "E707", "E708", "E709"]
[[code.cause]]
why = "the current tin key is not available (no keyring entry, no key file, nothing on --seal-key-fd)"
probe = "path-exists"
remedy = "cig tin key import the key you exported earlier, or put the keyring entry back (cigscript/tin-seal)"
[[code.cause]]
why = "the key came in on --seal-key-fd for this run only, so a rekey has no keeper to write to"
probe = "env-var"
remedy = "cig config seal_key keyring (or seal_key file) first, so the new key has somewhere to live"
[[code.cause]]
why = "an earlier rekey crashed and left a seal.key.old that no longer reads as a key"
probe = "path-exists"
remedy = "move the file aside (it is in the keys directory); the rekey picks up from a clean state on the next run"
[[code.cause]]
why = "another cig tin rekey is in progress on this tin"
probe = "path-exists"
remedy = "wait for the other one to finish; if it crashed, run cig tin rekey again and it picks up the walk"
[[code.cause]]
why = "a run's journal, or the ledger, does not verify under the current key"
probe = "path-exists"
remedy = "the run is named in the message; investigate the edit and either put the chain back (a backup) or move the run aside before running cig tin rekey again"
[[code.cause]]
why = "another command needed the key while a rekey was running, and the rekey outlasted rekey_wait (30 seconds by default)"
probe = "path-exists"
remedy = "wait for the rekey to finish and run the command again; cig config rekey_wait N changes how long a command waits"
[[code.cause]]
why = "the keeper would not carry the new key (keyring write failed the read-back, or the key file could not be written)"
probe = "none"
remedy = "both stashes stay on disk and every sealed object is still readable; fix the keeper (unlock the keyring, free space on the keys filesystem) and run cig tin rekey again to finish"

[[code]]
code = "E721"
title = "the tin's key folder is not private"
meaning = "The keys folder beside the state root holds the seal key, the ledger and the rekey lock; for the tin's history and its sealed objects to mean anything, that folder and the files in it must be yours and closed to other users. cig refuses when they are not: a folder another user owns or others can write to; a seal.key, ledger.jsonl or rekey.lock another user owns, or one that is a symlink or not a file; a seal.key others could read or that has a second name (a hard link), checked when the key is read from it. Nothing is signed, sealed or read under it. A ledger or lock of yours that is only too open holds no secret, so cig makes it 0600 and goes on. With CIGSCRIPT_HOME under a shared parent (such as /tmp, /var/tmp or /dev/shm) the folder has a per-user name (.cigscript-keys-<uid>), so two users under the same parent never share one; a folder of yours under the old shared name, still private, stays in use. Owners are named by uid (getent passwd <uid> names them). The folder is made 0700 from the start; CIG_KEYS_DIR and CIG_SEAL_KEY_FILE point somewhere else but do not weaken the checks."
fix = "a folder or file that is yours, made under sudo: chown it back to yourself. One that is not yours: move it aside (it is not your key), or set CIG_KEYS_DIR to a folder only you can write. A seal.key others could read: chmod 600 it, then cig tin rekey if anyone else could have read it; never move your own key aside, a new key opens nothing the old one sealed"
no = "these-are-mine"
arises = ["run", "any"]
tags = ["kernel"]
since = "1.19.0"
related = ["E707", "E720"]
[[code.cause]]
why = "another user owns the keys folder (someone made your per-user name under a shared parent first), or it is yours but was made under sudo"
probe = "path-exists"
remedy = "made under sudo: chown it back to yourself; not yours: you cannot use it, so set CIG_KEYS_DIR to a folder only you can write, or keep CIGSCRIPT_HOME out of a shared folder"
[[code.cause]]
why = "the keys folder is group- or world-writable, so someone else could plant seal.key or delete the ledger"
probe = "path-exists"
remedy = "chmod 700 the folder, or set CIG_KEYS_DIR to a folder only you can write"
[[code.cause]]
why = "seal.key is readable by group or world, so someone else may have read the key, or it has a second name (a hard link) it can be read through"
probe = "path-exists"
remedy = "chmod 600 it (a hard link: copy the key beside itself and move the copy over it), then cig tin rekey if anyone else could have read it; keep the file, a new key opens nothing the old one sealed"
[[code.cause]]
why = "seal.key, ledger.jsonl or rekey.lock is owned by another user, or is a symlink or not a file, so a read may be redirected or the file planted"
probe = "path-exists"
remedy = "yours, made under sudo: chown it back; a link: put the real file back in place; not yours: move it aside, or set CIG_KEYS_DIR / CIG_SEAL_KEY_FILE to a path only you can write"

[[code]]
code = "E722"
title = "a tin parcel does not verify"
meaning = "cig tin unparcel (or the check cig tin parcel runs on what it just wrote) found the parcel tampered with or incomplete, and wrote nothing. Every file the manifest names is hashed, every journal's chain and the ledger's chain are checked, and every object a journal needs must be in the parcel, in a parent parcel it names, or already in this tin. The message lists the first problems: a file that no longer hashes to the manifest, one that is missing, one that is there and not named, a parent parcel that is not the one the child was built on, a journal or ledger line that was edited, a ledger that cannot be checked because the tin's key is not here."
fix = "restore from an earlier parcel, or write a new one from the tin; for an incremental parcel keep every parent beside it; for a ledger that cannot be checked put the tin's key back first (cig tin key import) and run cig tin unparcel again"
no = "depends"
arises = ["run"]
tags = ["kernel"]
since = "1.21.0"
related = ["E703", "E708", "E709", "E723"]
[[code.cause]]
why = "a file in the parcel was changed, truncated or swapped after it was written"
probe = "file-hash"
remedy = "use another copy of the parcel, or an earlier one; the file is named in the message"
[[code.cause]]
why = "an incremental parcel's parent is missing, or is not the parcel it was built on"
probe = "path-exists"
remedy = "put the parent parcel folder where the child recorded it, or beside the child, and unparcel again"
[[code.cause]]
why = "the tin's key is not available, so the ledger's chain cannot be checked"
probe = "none"
remedy = "cig tin key import the key you exported, then unparcel again"
[[code.cause]]
why = "a journal or the ledger was edited, cut short or reordered"
probe = "none"
remedy = "the run or line is named; restore from an earlier parcel that verifies"

[[code]]
code = "E723"
title = "a different live run is in the way of an unparcel"
meaning = "cig tin unparcel verified the parcel and then found something here that it would have to overwrite: a run with the same id and a different journal, a sealed object or a kept copy with other bytes, or a ledger whose history differs from the parcel's. It writes nothing: a restore puts back what is missing and never replaces a live run with a different one. A run that is here and identical is left alone, so unparcel can be run again after a partial restore."
fix = "restore into an empty tin (a new CIGSCRIPT_HOME), or move the named run out of the way (cig unburn it, or cig runs --prune) and unparcel again; a ledger with another history belongs to another tin"
no = "depends"
arises = ["run"]
tags = ["kernel"]
since = "1.21.0"
related = ["E722", "E709"]
[[code.cause]]
why = "the run exists here with a journal that differs from the parcel's (it carried on after the backup was taken)"
probe = "run-record"
remedy = "keep the live run and skip that parcel, or move the live run aside and restore the backup's"
[[code.cause]]
why = "the ledger here and the parcel's diverged: neither is a prefix of the other"
probe = "none"
remedy = "the parcel is from another tin or another history; restore into an empty tin"

[[code]]
code = "E724"
title = "the vault refused or did not answer"
meaning = "The vault (the helper that keeps a copy of the tin's objects under its own account, where nothing that runs as you can delete them) is installed, but did not take an object: it is stopped, its socket is missing or is not the vault's, it answered no (its reason is in the note: a full share is quota, an object that does not hash to its name is hash-mismatch), or the connection broke part way. The run is not stopped: the objects are in the tin as always and the run unburns from it. What was kept only in the tin because the vault was not there is listed in tin/vault-pending and handed to the vault the next time it answers (the next run, or any run, notes it once); an object the vault refused for a reason that will not change is not listed again. Until the vault has the copy, a process running as you could still delete it from the tin."
fix = "start the vault (systemctl start cig-vault, or cig tin vault install if it is not installed); the next run hands over what waited. A refusal names its reason: free space (cig tin vault gc), or cig tin verify for an object that does not match its name"
no = "depends"
arises = ["run", "unburn"]
tags = ["kernel"]
since = "1.21.0"
related = ["E703", "E707", "E720"]
[[code.cause]]
why = "the vault is stopped, or its socket is gone"
probe = "path-exists"
remedy = "start it (systemctl start cig-vault); runs in the meantime are kept in the tin and handed over later"
[[code.cause]]
why = "the socket is there but is not owned by the vault's account (_cigtin), so cig does not talk to it"
probe = "path-permissions"
remedy = "do not trust it: it was not made by the vault. Remove it as an administrator and restart the vault"
[[code.cause]]
why = "the vault refused the object (quota, a hash that does not match, a recipe whose chunks it does not have)"
probe = "none"
remedy = "the reason is in the note; free the vault's space with cig tin vault gc, or run cig tin verify"

[[code]]
code = "E730"
title = "a pass does not hold"
meaning = "A pass was needed and the one given does not verify. The message names the first thing that failed, in the order cig checks: the tag, the issuer and epoch, revocation, the caveats, then the inputs. Examples of what it says: deploy.sh changed (size 120 then, 131 now); ~/.npmrc appeared; PATH changed; the caveat until 2026-11-14 has passed; revoked (cig pass revoke, 2026-11-09); issued under another key (another machine, or before cig tin rekey); issued at epoch 3, verdict passes are at epoch 4 (cig pass revoke --kind verdict). pass.check returns the same words as a value instead of stopping; pass.spend and cig pass verify stop with this code. Nothing is spent and nothing is written when a pass does not hold."
fix = "cig pass show <id> says which input or caveat failed; redo the work and issue a new pass (pass.memo does both), or ask for a fresh pass from whoever issued this one"
no = "these-are-mine"
arises = ["run", "any"]
tags = ["kernel"]
since = "1.20.0"
related = ["E731", "E735", "E736", "E737", "E738", "E739"]
[[code.cause]]
why = "an input the pass recorded has changed: a file edited, a file that appeared or went away, a folder listing, an environment variable, the cig build"
probe = "file-hash"
remedy = "the message names it; if the change is meant, redo the work (pass.memo, or cig run again) and the new pass records what is there now"
[[code.cause]]
why = "the pass was issued under another key: another machine, or before cig tin rekey"
probe = "none"
remedy = "a local pass only verifies on the machine and tin that issued it; for another machine use a shareable one (cig pass export on the issuing machine), or redo the work here"
[[code.cause]]
why = "the pass was revoked: cig pass revoke <id>, or cig pass revoke --kind <kind> moved the epoch past it"
probe = "none"
remedy = "cig pass log shows when and by what; redo the work for a new pass"
[[code.cause]]
why = "a caveat does not hold for what is being run: a time that has passed, a folder, a box, a network, an argument pattern, a cig version or build, an agent name"
probe = "none"
remedy = "the message names the caveat; narrowing only ever restricts, so ask the holder of the wider pass for one that fits, or run what the caveat allows"
[[code.cause]]
why = "a pass this one relied on no longer holds (a nested pass)"
probe = "none"
remedy = "cig pass show <id> lists the nested pass; fix that one first"

[[code]]
code = "E731"
title = "the work cannot be vouched for"
meaning = "pass.issue (or pass.memo) ran the work and could not record everything it depended on, so no pass was issued: a pass that missed an input would vouch for something that has changed. The message names the call that made the work open-world. The calls are proc.run and the rest of proc.* without reads: [paths]; proc.pipe; stdin(); cig.run_id(); fs.modified_ms (a time, not the bytes); time.now_ms, time.now_iso and time.stamp with no until given; any builtin a recording does not know; a read that failed for any reason other than the file not being there; and, on Windows, a path that is not UTF-8."
fix = "declare what the program reads: proc.run(cmd, args, {reads: [paths]}); for a clock, give pass.issue an until; otherwise take the call out of the work, or do not issue a pass for it"
no = "these-are-mine"
arises = ["run", "dry-run", "light"]
tags = ["kernel"]
since = "1.20.0"
related = ["E730", "E732", "E733", "E734"]
[[code.cause]]
why = "a proc.* call inside the work has no reads list, so what the program opened cannot be seen"
probe = "source-line"
remedy = "add reads: [the files and folders it looks at] to the call; reads: true alone keeps its old meaning (a hop that only reads) and declares nothing"
[[code.cause]]
why = "the work asks for something that is different every time: stdin(), cig.run_id(), time.now_ms with no until"
probe = "source-line"
remedy = "move the call out of the work and pass its value in through the subject; for a clock, give pass.issue an until so the pass expires"
[[code.cause]]
why = "a read inside the work failed for a reason other than the file being absent (permission denied, a bad path)"
probe = "path-permissions"
remedy = "fix the read; a file that is simply not there is fine, it is recorded as absent"
[[code.cause]]
why = "on Windows, a path or name the work used is not UTF-8"
probe = "none"
remedy = "use a path that is valid UTF-8, or do not issue a pass for this work"

[[code]]
code = "E732"
title = "the work reads a variable from outside it"
meaning = "The work given to pass.issue uses a value the recording cannot vouch for: a variable of the function around it, one a closure captured before the work began, a global that is not a constant (a roll, or a stick that is computed or changed anywhere), or args. The pass is looked up by its subject, so a value the work depends on that is not in the subject would let the pass be reused when that value is different. Constant sticks (literals, and lists and maps of them, never changed) and pulls may be read. The work may not change a variable outside it either. pass.recording() is true inside a work, so a cache can step aside there. The message names the variable and the line."
fix = "put the value in the subject, and read it from the argument the work is called with: pass.issue(\"check\", {n: n}, pack(s) => s.n + 1)"
no = "these-are-mine"
arises = ["run", "dry-run", "light"]
tags = ["kernel"]
since = "1.20.0"
related = ["E731", "E733"]
[[code.cause]]
why = "the work names a roll, a stick or a parameter of the function it sits in"
probe = "source-line"
remedy = "add it to the subject map and read it from the work's argument, so the pass is keyed on it"
[[code.cause]]
why = "the work uses a global or a pulled name whose value changes between runs"
probe = "source-line"
remedy = "put what it holds in the subject, or read it inside the work, where the recorder sees it"

[[code]]
code = "E733"
title = "the work changed the world"
meaning = "A burn happened inside the work given to pass.issue. A pass vouches for something that was looked at; work that changes the world cannot be skipped by a later lookup, so it cannot be vouched for."
fix = "keep the burn outside: do the checking in pass.issue, then burn { } on what it returned"
no = "these-are-mine"
arises = ["run", "dry-run", "light"]
tags = ["kernel"]
since = "1.20.0"
related = ["E701", "E731", "E732"]
[[code.cause]]
why = "an fs write, an env set or another burn sits inside the work"
probe = "source-line"
remedy = "move it out; use the pass's result to decide whether to burn"
[[code.cause]]
why = "the work calls a pull that burns, or a hop that is declared as changing things"
probe = "source-line"
remedy = "call it outside pass.issue, after the pass is found or issued"

[[code]]
code = "E734"
title = "an input changed while the work ran"
meaning = "The work read the same thing twice and got two different answers, so there is no one state to vouch for. No pass was issued. The message names the input and what differed."
fix = "run it again when nothing else is writing; if the same input is read more than once, read it once and keep the value"
no = "depends"
arises = ["run", "light"]
tags = ["kernel"]
since = "1.20.0"
related = ["E730", "E731"]
[[code.cause]]
why = "another program, or a watcher, changed a file while the work was reading it"
probe = "file-hash"
remedy = "stop the writer, or run the work when it is quiet, then run it again"

[[code]]
code = "E735"
title = "a pass is already spent"
meaning = "A pass with a once caveat was used before, or a pass with max n was used n times. The use is recorded in the ledger (a pass-spend line), and narrowing the pass further does not give it a new spend. The message says which caveat and, when it is known, which run used it."
fix = "ask for a new pass; cig pass log shows where this one was spent"
no = "these-are-mine"
arises = ["run", "any"]
tags = ["kernel"]
since = "1.20.0"
related = ["E730", "E737"]
[[code.cause]]
why = "the pass was issued with once and has been used"
probe = "none"
remedy = "cig pass log shows the run that used it; issue another pass if another use is meant"
[[code.cause]]
why = "the pass was issued with max n and has been used n times"
probe = "none"
remedy = "cig pass log shows each use; issue another pass if more are meant"
[[code.cause]]
why = "the pass is a narrowing of one that was spent (a caveat appended after once keeps the original's spend)"
probe = "none"
remedy = "narrowing never adds uses; go back to whoever issued the original"

[[code]]
code = "E736"
title = "not a pass"
meaning = "The bytes given as a pass do not decode. Decoding is strict, so a token cut short, one with extra bytes after it, an unknown version, an unknown kind, input or caveat, an input list that is not sorted, or a path that is not absolute is refused as a whole; nothing is read past the first problem."
fix = "copy the whole token (it starts with cigpass1.), or ask for it again; a token from a newer cig needs `ciginstaller update`"
no = "cant-see-any"
arises = ["run", "any"]
tags = ["kernel"]
since = "1.20.0"
related = ["E730", "E738"]
[[code.cause]]
why = "the token was cut or changed on the way (a line wrap, a missing end, a stray space)"
probe = "none"
remedy = "pass it as a file (cig pass verify <file>), or copy it again in one piece"
[[code.cause]]
why = "the pass was made by a newer cig, and uses a version, kind, input or caveat this one does not know"
probe = "none"
remedy = "`ciginstaller update`; an unknown caveat is never ignored, because ignoring it would widen the pass"
[[code.cause]]
why = "the file is not a pass"
probe = "file-hash"
remedy = "check the path; cig pass list shows the passes this machine holds"

[[code]]
code = "E737"
title = "a pass needs a discharge"
meaning = "The pass carries a needs caveat, such as needs human-yes, and nothing given with it discharges it. The discharge is a second pass of that kind, about this pass's root id. A human-yes is signed only by a human authority this machine trusts: an Ed25519 key in /etc/cigscript/authority.pub, a file root owns, installed by an administrator, whose private key sits behind the platform's own authentication; it must expire within the hour. No variable, flag or other file stands in for it. On a machine with no authority installed, needs human-yes cannot be met."
fix = "ask for the discharge (for human-yes, the approval the gate shows); then give both: the pass and its discharge"
no = "dont-have-any"
arises = ["run", "any"]
tags = ["kernel"]
since = "1.20.0"
related = ["E730", "E735"]
[[code.cause]]
why = "the person has not approved yet, so no discharge exists"
probe = "none"
remedy = "approve it where the gate asks; the discharge is made after that, and cannot be made before"
[[code.cause]]
why = "a discharge was given but it is for a different pass, or has failed to verify itself"
probe = "none"
remedy = "cig pass show <discharge> says why; a discharge only fits the pass whose root id it names"

[[code]]
code = "E738"
title = "the signer is not trusted here"
meaning = "A shareable pass was signed by a key that is not trusted here for its kind, so the signature was never trusted. Nothing was read from the pass beyond the key. Allowed signers use the OpenSSH format cigcompile verify --allowed-signers reads; each key is trusted only for the kinds its namespaces option names (namespaces=\"cigpass-check,cigpass-program\"), and a line without one allows no pass. Approvals, verdicts, rules, doctor, trial and run passes never come from another machine at all."
fix = "on the machine that signed, cig pass key --kinds check,program prints the line to add; add it to the allowed signers file (cig config pass_allowed_signers <file>), or pass --allowed-signers <file> for one command"
no = "never-heard-of-you"
arises = ["run", "any"]
tags = ["kernel"]
since = "1.20.0"
related = ["E730", "E736"]
[[code.cause]]
why = "the signer's key has not been added to the allowed signers file"
probe = "path-exists"
remedy = "ask the signer for the line cig pass key prints, and add it to the file"
[[code.cause]]
why = "the allowed signers file is not where cig looks (the default is the allowed_signers file in the cig home)"
probe = "path-exists"
remedy = "cig config pass_allowed_signers <file>, or --allowed-signers <file>"
[[code.cause]]
why = "the signer ran cig tin rekey, so its key is a new one"
probe = "none"
remedy = "a rekey changes the signing key; add the new line from cig pass key and drop the old one"

[[code]]
code = "E739"
title = "the pass state cannot be trusted"
meaning = "The pass state (each kind's epoch, the spends and the revocations) is folded from the ledger and kept in a cache beside the passes, MAC'd under a subkey of the tin's key (a cig tin rekey starts a new one, folded again from the re-signed ledger) and pinned to the ledger's length and last line. Each local pass also carries the ledger's length when it was made, so a ledger deleted or cut below that refuses it. cig refuses it when the cache fails its MAC, when the ledger is shorter than the cache expects (cut, or an older copy put back), or when the line the cache was read at is another one. A missing cache is rebuilt from the ledger, never reset, so deleting it never brings a revoked pass back. While refused, every pass is invalid. A whole keys folder put back from an older copy cannot be told apart here: cig tin head is the anchor to keep elsewhere."
fix = "a cache that fails its MAC: cig pass gc folds the state again from the ledger, after checking the ledger's chain; a ledger cut short or replaced: cig runs --verify says what is missing"
no = "these-are-mine"
arises = ["run", "any"]
tags = ["kernel"]
since = "1.20.0"
related = ["E721", "E720", "E730"]
[[code.cause]]
why = "the passes folder or a file in it is owned by another user, is group- or world-writable, or is a symlink"
probe = "path-permissions"
remedy = "made under sudo: chown it back to yourself; not yours: move it aside, it holds nothing of yours, and cig makes a new one"
[[code.cause]]
why = "the cache was edited or written by something else, or the ledger was cut or put back from an older copy"
probe = "path-exists"
remedy = "cig pass gc rebuilds the cache from the ledger; for the ledger itself, cig runs --verify and cig tin verify --head say what changed"

[[code]]
code = "E750"
title = "literal path outside the pack"
meaning = "A write names a literal path that sits outside the script's declared pack (its scope), so the checker refuses it before anything runs."
fix = "move the path inside a declared root, or add the root to pack { }"
no = "these-are-mine"
arises = ["check"]
tags = ["kernel"]
since = "1.1.0"
related = ["E751", "E753"]
[[code.cause]]
why = "the pack declares a narrower scope than the script writes to"
probe = "source-line"
remedy = "add the root to pack { } if the write is intended; otherwise fix the path"

[[code]]
code = "E751"
title = "path outside the pack"
meaning = "At run time a burn tried to touch a path outside the declared pack; the kernel refused it and nothing was changed."
fix = "the plan shows the pack beside the ops; widen the pack or fix the computed path"
no = "these-are-mine"
arises = ["run", "dry-run", "light"]
tags = ["kernel"]
since = "1.1.0"
related = ["E750", "E752"]
[[code.cause]]
why = "a computed path (joined, globbed, from args) resolved outside the pack's roots"
probe = "path-exists"
remedy = "exhale the path before the burn; the pack's roots are in the plan header"

[[code]]
code = "E752"
title = "hop wrote outside the pack"
meaning = "A child process changed files in its working directory outside the declared pack. The kernel cannot undo them; they are listed so nothing is hidden. Writes elsewhere are not watched at all: the hop's irreversible label is their only record."
fix = "point the program at the pack (its cwd, an output flag), or add the root it wrote to"
no = "these-are-mine"
arises = ["run", "light"]
tags = ["kernel", "irreversible-involved"]
since = "1.1.0"
related = ["E751"]
[[code.cause]]
why = "the program writes to its working directory, which is not in the pack"
probe = "none"
remedy = "run it with {cwd: <a pack root>}, or add that directory to pack { }"

[[code]]
code = "E753"
title = "pack misplaced"
meaning = "pack { } must be the first statement of a script and appear once: the scope is declared before anything can burn."
fix = "move pack { } to the top of the file and keep one"
no = "none"
arises = ["check"]
since = "1.1.0"
related = ["E750"]
[[code.cause]]
why = "a second pack { }, or one below other statements"
probe = "source-line"
remedy = "one pack { }, first line after the comments"

[[code]]
code = "E754"
title = "compensation reaches outside its state"
meaning = "An unburn { } block refers to a name that is not its state map, a module or a builtin. Compensations run later, in another process, from the journal alone, so they may use only what was put in the state."
fix = "put the value in the state map inside the burn block (burn (s) { s.sha = ... }) and read s.sha in unburn { }"
no = "none"
arises = ["check"]
since = "1.1.0"
[[code.cause]]
why = "the compensation uses a variable from the surrounding script"
probe = "source-line"
remedy = "copy it into the state map in the burn block; the map is journaled with the compensation"

[[code]]
code = "E755"
title = "bad pack root"
meaning = "A pack root is empty, which would have meant the whole working directory; the pack is refused before anything runs."
fix = "name the directory the script may write in, pack { \"./build\" }"
no = "none"
arises = ["check", "run"]
since = "1.1.1"
related = ["E750", "E751"]
[[code.cause]]
why = "pack { \"\" }, or a root computed from an empty string"
probe = "source-line"
remedy = "give the root a name; an empty string is not a directory"

[[code]]
code = "E756"
title = "fold shape mismatch"
meaning = "A folded unit is lit with the wrong number or names of arguments; the error names the unit, the caller and the mismatch."
