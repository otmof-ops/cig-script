why = "the target is another machine's and its cig was never fetched"
probe = "none"
remedy = "download that cig release asset, check its sha256, and pass it with --runtime"

[[code]]
code = "E1002"
title = "the runtime is another cig"
meaning = "The cig given as the runtime is not the version the compiler was built with. A program runs only on the cig it was compiled for, so the two must agree."
fix = "pass the cig of the compiler's version with --runtime, or use the cigcompile built for that cig"
no = "none"
arises = ["compile"]
tags = ["compiler"]
since = "1.15.0"
related = ["E1051"]
[[code.cause]]
why = "--runtime names an older or a newer cig than the compiler's"
probe = "none"
remedy = "compare cig --version with cigcompile --version and pick the matching cig"

[[code]]
code = "E1003"
title = "the script's pin is not met"
meaning = "The script pins a cig version (a `# cig` line or a .cig-version file) that the runtime it would be appended to does not satisfy."
fix = "build with a cigcompile whose cig meets the pin, or move the pin once the script works on this cig"
no = "none"
arises = ["compile"]
tags = ["compiler"]
since = "1.15.0"
[[code.cause]]
why = "the script asks for a newer cig than this compiler's"
probe = "source-line"
remedy = "update cig and cigcompile together, or lower the pin after testing the script"

[[code]]
code = "E1004"
title = "the program cannot be written"
meaning = "The compiled program could not be written where it was asked to go. Nothing was left half-written there: the output is written beside it and moved into place whole."
fix = "write it somewhere you can with -o, or free the space the message names"
no = "depends"
arises = ["compile"]
tags = ["compiler", "resource"]
since = "1.15.0"
[[code.cause]]
why = "the output folder is not writable by you"
probe = "path-permissions"
remedy = "pick another folder with -o, or fix the folder's permissions"
no = "these-are-mine"
[[code.cause]]
why = "the disk is full"
probe = "disk-free"
remedy = "free some space, then build again"
no = "dont-have-any"

[[code]]
code = "E1005"
title = "the runtime already carries a program"
meaning = "The file given as the runtime ends in a program's trailer: it is a compiled program, not cig, and a program is never appended to another."
fix = "give the cig binary itself with --runtime, not a program compiled from it"
no = "none"
arises = ["compile"]
tags = ["compiler"]
since = "1.15.0"
[[code.cause]]
why = "--runtime points at a compiled program"
probe = "file-hash"
remedy = "point it at cig itself (`command -v cig` shows where it is)"

[[code]]
code = "E1006"
title = "an unknown target"
meaning = "The target named with --target is not one cig is released for, so there is no cig to append the program to."
fix = "pick one cigcompile targets lists, e.g. --target x86_64-unknown-linux-musl"
no = "never-heard-of-you"
arises = ["compile"]
tags = ["compiler"]
since = "1.15.0"
[[code.cause]]
why = "the target triple is mistyped, or is one cig does not ship"
probe = "none"
remedy = "copy the triple from cigcompile targets"

[[code]]
code = "E1007"
title = "two programs would share one name"
meaning = "Two scripts in the folder would compile to the same program: their names differ only in case, on a folder that does not tell case apart."
fix = "rename one of the scripts, or build each with its own -o"
no = "none"
arises = ["compile"]
tags = ["compiler"]
since = "1.15.0"
[[code.cause]]
why = "tool.cig and Tool.cig compiled into one folder"
probe = "none"
remedy = "rename one of them"

[[code]]
code = "E1008"
title = "the runtime would tie programs to this machine's libc"
meaning = "A Linux program runs anywhere because its runtime is static: cig's Linux releases need nothing from the machine. The only cig found here is dynamically linked, so a program made from it would start only where the same C library, of the same version or newer, is installed."
fix = "fetch cig's static release (cigcompile fetch), or build cigcompile for this machine's -musl target"
no = "dont-have-any"
arises = ["compile"]
tags = ["compiler"]
since = "1.15.1"
[[code.cause]]
why = "cigcompile was built with a plain cargo build, so the cig-runtime beside it links this machine's glibc, and cig's release could not be fetched (CIGCOMPILE_OFFLINE, or no network)"
probe = "none"
remedy = "cigcompile fetch while online, or cargo build --release --target x86_64-unknown-linux-musl"
[[code.cause]]
why = "the cig on PATH was built from source rather than installed from the release"
probe = "on-path"
remedy = "`ciginstaller update` installs the static release; or pass a static cig with --runtime"

[[code]]
code = "E1009"
title = "a script whose name is not printable"
meaning = "A program records the name of the script it was compiled from, and prints it in its errors and in cig runs. This script's name holds a control character or an invisible one (a bidi control such as U+202E, a zero-width character), so it could show as another name; cig refuses such a program at run time (E1050), so cigcompile refuses to make one."
fix = "rename the script to a name that shows as it is, then build again"
no = "none"
arises = ["compile"]
tags = ["compiler"]
since = "1.16.0"
[[code.cause]]
why = "the file came from somewhere else with a name built to read differently on a terminal (tidy\u202egpj.cig shows as tidygic.jpg)"
probe = "none"
remedy = "rename it, and look at what else that source sent"

# ----- E1050-E1099: a compiled program at run time (emitted by cig) -------

[[code]]
code = "E1050"
title = "a damaged program"
meaning = "This program's bytes do not match the sha256 in its trailer, its record does not read, or its trailer is not at its end: it was cut short, edited, or had bytes written after it once it was compiled, and it refuses to run. A program knows it is one even without its trailer (its record starts where its runtime's image ends), so a damaged program never runs as cig. Zero padding, or a Windows certificate table from signing, may follow the trailer. The sha256 catches damage, not tampering: programs are unsigned."
fix = "compile it again (cigcompile build), or fetch it again from where it came from"
no = "none"
arises = ["run"]
since = "1.15.0"
related = ["E1051"]
[[code.cause]]
why = "the file was cut short or changed after it was compiled: a partial download, a copy that stopped, a tool that rewrote it"
probe = "file-hash"
remedy = "compare its sha256 with the one from the build, then rebuild it or fetch it again"
[[code.cause]]
why = "something was written after the program: a tool that appends data, or a signature that is not a PE certificate table"
probe = "file-hash"
remedy = "build it again, then sign it with a tool that keeps the program's end (cig-compile#10)"

[[code]]
code = "E1051"
title = "a program for another cig"
meaning = "The program was compiled for one cig and appended to another. A program runs only on the cig it was compiled for, so the kernel it expects is the kernel it gets."
fix = "compile it again with the cigcompile for this cig, or keep the binary cigcompile made"
no = "none"
arises = ["run"]
since = "1.15.0"
related = ["E1002"]
[[code.cause]]
why = "the program's script was appended to a different cig by hand or by an older tool"
probe = "none"
remedy = "build it again with cigcompile build"

[[code]]
code = "E1054"
title = "a program with raised rights"
meaning = "The system started this program with more rights than whoever ran it: its file is setuid or setgid, or has file capabilities. A program reads its caller's environment (PATH for the commands it runs by name, CIGSCRIPT_HOME and HOME for its runs and keys), so with raised rights it would run the caller's commands, and keep its runs and keys where the caller chose, as the file's owner. It refuses before it reads any of that."
fix = "run it with sudo instead, and take the bits off its file: chmod u-s,g-s, setcap -r"
no = "these-are-mine"
arises = ["run"]
since = "1.15.1"
related = ["E1050"]
[[code.cause]]
why = "the program's file was made setuid or setgid (chmod u+s, g+s), or given capabilities (setcap), so that other users run it as its owner"
probe = "path-permissions"
remedy = "give those users a sudo rule for it instead, and take the bits off: chmod u-s,g-s, setcap -r"

[[code]]
code = "E1055"
title = "a program that cannot read itself"
meaning = "A program finds its script at the end of its own file. This one cannot open its file (installed execute-only, such as mode 0711, and run by someone without read permission), so it cannot tell whether it is a program, and it refuses rather than act as a general cig. A binary named cig or cig-runtime is cig, and runs as cig either way."
fix = "make it readable by whoever runs it (chmod 755), as cigcompile writes it"
no = "these-are-mine"
arises = ["run"]
since = "1.15.1"
related = ["E1050"]
[[code.cause]]
why = "the program was installed execute-only, to ship a tool without handing out its contents; a program's script is in its file, so it must read it"
probe = "path-permissions"
remedy = "chmod 755 the program"

[[code]]
code = "E1052"
title = "not one of the program's run flags"
meaning = "A compiled program takes the run's flags first and its own arguments after them; this one is not a run flag, it lacks its value, or an argument is not valid UTF-8. Nothing ran."
fix = "put the program's own arguments after --: tool -- --flag (tool --help lists the run flags)"
no = "none"
arises = ["run"]
tags = ["beginner-likely"]
since = "1.15.0"
[[code.cause]]
why = "a flag meant for the program itself, given before --"
probe = "none"
remedy = "move it after --"
[[code.cause]]
why = "a mistyped run flag (refused, so a mistyped --dry-run never becomes a real run)"
probe = "none"
remedy = "spell it as tool --help shows it"

[[code]]
code = "E1053"
title = "not this program's run"
meaning = "A compiled program puts back only the runs it made (`--unburn`); the run named was made by a script or by another program."
fix = "use cig unburn <run> for any run, or the program that made it"
no = "these-are-mine"
arises = ["unburn"]
since = "1.15.0"
[[code.cause]]
why = "the run id belongs to another script's or program's run"
probe = "run-record"
remedy = "cig runs <run> shows which script or program made it"
