[[code]]
code = "E773"
title = "a decoy was read"
meaning = "The box ran with box.decoys naming a credential path (~/.ssh/id_*, ~/.aws/credentials, .env, a browser store), a hop opened the path, and the watch served a decoy fd in place of the real file. The hop saw a plausible fake carrying this run's unique marker; the real bytes never left the host. The read is in the event log and in r.events; it is evidence, not a refusal, and the hop runs on."
fix = "nothing to fix for the hop; read the events in cig runs <id> and treat the read as the finding it is: the program the hop ran asked for a credential the box said it must not have"
no = "none"
arises = ["run"]
tags = ["kernel"]
