[[code]]
code = "E757"
title = "touches without a pack"
meaning = "A hop was given `touches` (the files it may change, to be kept in the tin first), but the script declares no pack, so the kernel has nothing to watch; or a path under `touches` could not be kept."
fix = "declare pack { \".\" } (or the roots the hop writes under) as the first statement"
no = "cant-see-any"
arises = ["run", "light"]
since = "1.2.0"
related = ["E750", "E752"]
