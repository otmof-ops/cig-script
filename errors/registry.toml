remedy = "read the events; a credential a tool needs is passed with box.pass_reads so only that program reads it"
[[code.cause]]
why = "an exfiltration attempt in the hop's dependency tree (a build script, a postinstall, a parser plugin)"
probe = "none"
remedy = "treat it as the finding it is; cig-orchestrator's guard raises it on a rehearsal"

[[code]]
code = "E774"
title = "a decoy marker was written out"
meaning = "A file the hop wrote under the pack holds the marker a decoy carried into the box, so the hop read a credential-sized decoy and tried to carry the marker back out. Exfiltration gets its first evidence, and the hop runs on: the pack reader for the run names the file."
fix = "nothing to fix in the hop; the write is in r.events and in the hop's log, with the file's path; treat it as the finding it is"
