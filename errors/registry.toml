[[code]]
code = "E775"
title = "a passed credential was read by the wrong program"
meaning = "box.pass_reads named a program that may read a credential (npm reads ~/.npmrc, cargo reads ~/.cargo/credentials.toml), and a different process in the hop's tree opened the same path. The decoy mount served the decoy to that process (the real bytes never left the host). The real file descriptor the supervisor hands into the allowed program is a plain fd: it is inherited on fork and reachable via /proc/<pid>/fd by same-uid processes in the hop, so pass_reads is for a cooperating program, not an adversarial one."
fix = "if the reader is legitimate, name it under box.pass_reads; otherwise this is the finding, and the hop should not be run outside the box until it is explained"
no = "these-are-mine"
arises = ["run"]
tags = ["kernel"]
since = "1.21.0"
related = ["E773", "E774", "E777"]
[[code.cause]]
why = "a postinstall or build script in the hop's tree reads a passed credential (a postinstall that curls to a server, a bundler that reads ~/.npmrc for a token the install does not need)"
probe = "none"
remedy = "read the event's exe field; name the legitimate reader under box.pass_reads by its absolute path, or treat the read as the finding"
[[code.cause]]
why = "the allowed program forks and a child in the hop reaches the inherited real fd via /proc/<pid>/fd or by inheritance"
probe = "none"
remedy = "a hop is a trust boundary around a program, not around its children; keep pass_reads for cooperating programs, and rotate the credential if a hostile child in the hop is a concern"
[[code.cause]]
why = "the pass_reads entry resolved the program against PATH to a different binary (a shadow tool a corrupted PATH names) and the real tool missed the filter"
probe = "none"
remedy = "name the program by its absolute path in box.pass_reads; cig doctor says which paths are on PATH"
[[code.cause]]
why = "the allowed program opened the credential through a relative path, a symlink, or a dirfd-relative name whose string did not match the pass_reads entry"
probe = "none"
remedy = "open the credential by its absolute path (as box.pass_reads names it); the decoy mount still shadows the real file either way, so this is a convenience for the allowed program, not a leak"

