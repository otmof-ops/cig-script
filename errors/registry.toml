remedy = "the hop still ran; the change to that file is irreversible this time, as the warning says"

[[code]]
code = "E758"
title = "a Windows device name used as a file"
meaning = "A write names a path with a component that is a Windows device (con, prn, aux, nul, conin$, conout$, com0-9, lpt0-9, the superscript digits included, with any extension). On Windows that is the device, not a file, and the write is refused before anything is journaled, pack or no pack; elsewhere it is an ordinary file, so the checker only warns that the script will not run on Windows."
fix = "name the file something else"
no = "cant-see-any"
arises = ["check", "run", "light"]
tags = ["kernel"]
