tags = ["kernel"]
since = "1.21.0"
related = ["E779", "E777"]
[[code.cause]]
why = "the program or a library it uses reaches for io_uring (a runtime with an io_uring backend, a database, a benchmark), as an optimization"
probe = "none"
remedy = "read the event in r.events or cig runs <id>; most runtimes fall back to epoll on EPERM"
[[code.cause]]
why = "code that wants a path to the kernel the watch cannot see"
probe = "none"
remedy = "treat it as a finding: nothing ordinary needs io_uring inside a rehearsal"

