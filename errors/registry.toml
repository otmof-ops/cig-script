[[code]]
code = "E759"
title = "the pack is in use by another run"
meaning = "Another cig run (or an unburn) holds this pack, or a pack that contains or lies inside it. Hop watching reads every change in a pack between its two scans as the hop's, so two runs writing in one pack would roll back each other's work; the second is refused before anything is changed."
fix = "wait for that run to finish (`cig runs` shows it), or give the two runs packs that do not overlap"
no = "cant-see-any"
arises = ["run", "light", "unburn"]
tags = ["kernel"]
since = "1.4.0"
related = ["E751", "E752"]
[[code.cause]]
why = "a run is in progress on this pack from another terminal, or a cigo task is running there"
probe = "run-record"
remedy = "wait for it, or run the two with different packs; the lock is released when the run ends"
[[code.cause]]
why = "a run holding the lock was killed and its lock file is still held by a process that outlived it"
probe = "pid-alive"
remedy = "`cig runs` names the holder; end that process, and the lock goes with it"

[[code]]
code = "E760"
title = "the journal's chain is broken"
meaning = "Every line of a run's journal is chained to the line before it: by a hash in format 2 (since 1.5.0), by a signature under the tin's key in format 3 (since 1.9.0). A line edited, removed or reordered after the run no longer fits its neighbours, and in format 3 nothing without the key can re-chain it; a journal that ends somewhere other than the head its run record saved was cut short or added to. cig unburn refuses to treat such a journal as the record of what the run did, and cig runs <id> --verify says the same."
fix = "cig runs <id> --verify names the first line that does not fit; cig unburn <id> --force restores from the journal as it is"
no = "cant-see-any"
arises = ["unburn", "runs"]
tags = ["kernel"]
since = "1.5.0"
related = ["E703", "E704", "E709"]
[[code.cause]]
why = "a signed journal (format 3) was edited and its chain recomputed by something without the key: the signature on the first changed line does not match"
probe = "none"
remedy = "the record was tampered with; look at the files themselves before restoring anything, and at what else ran as you"
[[code.cause]]
why = "a journal line was edited by hand, or a tool rewrote the file"
probe = "none"
remedy = "`cig runs <id> --verify` says which line; if the edit was yours and the rest is right, `cig unburn <id> --force`"
[[code.cause]]
why = "lines were removed, or the journal was replaced with another run's"
probe = "none"
remedy = "the record cannot be trusted as it is; look at the files themselves before restoring anything"

[[code]]
code = "E761"
title = "a hop's report could not be used"
meaning = "The hop spoke the burn protocol (it appended to the file CIG_JOURNAL names), and a line of what it said could not be taken at its word: it was not JSON, named a path outside the pack, claimed a before-state that does not match what the tin kept, or reported a change without a copy of the bytes before it. The kernel never trusts a hop's word about bytes it can check; the change stays as the scan saw it, irreversible where the tin has nothing."
fix = "docs/PROTOCOL.md has the line shapes; report paths inside the pack, and keep a copy of the before-bytes (`saved`) or give an `undo` command"
no = "cant-see-any"
arises = ["run", "light"]
tags = ["kernel"]
since = "1.6.0"
related = ["E752", "E757"]
[[code.cause]]
why = "the tool reported a write or delete without `saved`, or with a copy that does not hash to the `before` it claims"
probe = "none"
remedy = "save the before-bytes before writing and name the copy in `saved`; or report a `compensate` line, which undoes the change by command"
[[code.cause]]
why = "the tool reported a path outside the pack, or a line that is not JSON"
probe = "none"
remedy = "widen pack { } if the path is the pack's; one JSON object per line, with `op` and `path`"

[[code]]
code = "E762"
title = "a parcel could not be written or imported"
meaning = "A parcel is a run's record and every object its journal needs in one file, with a manifest naming each file's hash. An import checks every file against the manifest, needs every root of the pack mapped to a place here, and needs the key for any sealed object; when any of that fails, nothing is imported. Writing one fails when the run's objects cannot be read, a blob git no longer has among them."
fix = "cig unparcel --show <file> lists the roots to map; --root name=path for each, --cwd when the working directory cannot be told, --allow-sealed-missing to import what this machine cannot open"
no = "cant-see-any"
arises = ["unburn", "runs"]
tags = ["kernel"]
since = "1.6.0"
related = ["E703", "E704"]
[[code.cause]]
why = "a root of the pack is not mapped, or the working directory cannot be told from the roots"
probe = "none"
remedy = "`cig unparcel --show <file>`, then `--root name=/path/here` for each root, and `--cwd` when asked"
[[code.cause]]
why = "a file does not hash as the manifest says: the parcel was changed, or cut short, after it was written"
probe = "none"
remedy = "get the parcel again from where it was made; nothing of it was imported"
[[code.cause]]
why = "the parcel holds sealed objects this machine's key does not open"
probe = "none"
remedy = "copy the key that sealed them (the keyring entry cigscript/tin-seal, or ~/.cigscript/tin/seal.key), or `--allow-sealed-missing`"

[[code]]
code = "E763"
title = "the box could not be made, or its layer not applied"
meaning = "A hop asked to run in the box (`{box: true}`): over a copy-on-write layer on the pack, applied only when the hop succeeds. As a warning: the box could not be made here (no user namespaces, a kernel before 5.11, another operating system, a filesystem overlayfs cannot layer over), so the hop ran on the tin as usual. As an error: the hop succeeded but a change in its layer could not be applied to the pack; what was applied before it is in the journal, and the run's rollback puts it back."
fix = "the warning needs nothing done unless the box was the point: Linux 5.11 or later with user namespaces allowed (kernel.apparmor_restrict_unprivileged_userns=0 on Ubuntu); the error names the path that refused"
no = "cant-see-any"
arises = ["run", "light"]
tags = ["kernel"]
since = "1.6.0"
related = ["E757", "E752"]
[[code.cause]]
why = "unprivileged user namespaces are off, or restricted by AppArmor (Ubuntu 23.10 and later), or the kernel is older than 5.11"
probe = "none"
remedy = "`sysctl kernel.apparmor_restrict_unprivileged_userns=0` and `kernel.unprivileged_userns_clone=1`, or run the hop without `box`"
[[code.cause]]
why = "the operating system has no overlayfs (macOS, Windows, the BSDs)"
probe = "none"
remedy = "the hop runs on the tin there; `touches` keeps what it may change"
[[code.cause]]
why = "the script declares no pack { }: the box is a layer over the pack, so there is nothing to put it over"
probe = "none"
remedy = "declare pack { \".\" } as the script's first statement"
[[code.cause]]
why = "a path in the layer could not be written to the pack (permissions, a device full)"
probe = "path-permissions"
remedy = "the run rolled back what was applied; fix the path and run again"

[[code]]
code = "E764"
title = "the ledger's chain is broken, so nothing is appended"
meaning = "Every ledger line is signed over the line before it, under the tin's key. An append chains its new line onto the last one, so a last line that no key verifies (edited, replaced, cut mid-line, or signed under a key this machine does not have) would be given a good line after it and the break would look as if it had always been there. The run's own work is not affected; the ledger is left as it is and the run says so. E760 is the same check on a run's journal."
fix = "`cig runs --verify` names the first line that does not fit; look at what changed the ledger before anything else is trusted"
no = "cant-see-any"
arises = ["run", "unburn", "runs"]
tags = ["kernel"]
since = "1.20.0"
related = ["E760", "E709"]
[[code.cause]]
why = "a ledger line was edited by hand, or a tool rewrote the file"
probe = "none"
remedy = "`cig runs --verify` says which line; the record cannot be re-signed without the key, so restore the ledger from a copy you trust"
[[code.cause]]
why = "the ledger was written under another machine's key (a tin copied without its key)"
probe = "none"
remedy = "copy the key that signed it"
[[code.cause]]
why = "the last line was cut short by a crash or a full disk"
probe = "none"
remedy = "`cig runs --verify` names the line; keep a copy of the ledger, then cut the torn last line away"

