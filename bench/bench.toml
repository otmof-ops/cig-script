# ----- the kernel set -----------------------------------------------------

[[case]]
name   = "burn small tree"
group  = "kernel"
run    = ["cig", "run", "kernel/burn-small.cig"]
per    = 1
burned = 102400     # 100 files of 1,024 bytes
ops    = 101        # a mkdir and 100 writes
gate   = ["disk"]
reference = { disk-per-byte = 5.28 }   # what main stores (1 KiB files in 4 KiB blocks on ext4); a change that raises it edits this line in review
expect = { exit = 0, stdout = "kernel/burn-small.expect" }
measure = ["wall", "rss", "tin-growth", "disk-per-byte", "fsyncs-per-op"]

[[case]]
name   = "burn big tree"
group  = "kernel"
run    = ["cig", "run", "kernel/burn-big.cig"]
per    = 1
burned = 16384000   # 1,000 files of 16,384 bytes
ops    = 1001
gate   = ["disk"]
reference = { disk-per-byte = 1.06 }
expect = { exit = 0, stdout = "kernel/burn-big.expect" }
measure = ["wall", "rss", "tin-growth", "disk-per-byte", "fsyncs-per-op"]

[[case]]
name   = "unburn small tree"
group  = "kernel"
run    = ["cig", "unburn", "--last", "1", "-y"]
before = ["cig", "run", "kernel/burn-small.cig"]
per    = 1
ops    = 101
after  = ["cig", "run", "kernel/check-gone.cig", "--", "small"]
expect = { exit = 0, after_stdout = "kernel/check-gone-small.expect" }
measure = ["wall", "rss", "tin-growth", "fsyncs-per-op"]

[[case]]
name   = "unburn big tree"
group  = "kernel"
run    = ["cig", "unburn", "--last", "1", "-y"]
before = ["cig", "run", "kernel/burn-big.cig"]
per    = 1
ops    = 1001
after  = ["cig", "run", "kernel/check-gone.cig", "--", "big"]
expect = { exit = 0, after_stdout = "kernel/check-gone-big.expect" }
measure = ["wall", "rss", "tin-growth", "fsyncs-per-op"]

[[case]]
name   = "overwrite big file"
group  = "kernel"
run    = ["cig", "run", "kernel/write-big.cig", "--", "b"]
before = ["cig", "run", "kernel/write-big.cig", "--", "a"]
per    = 1
burned = 33554432   # one file of 32 MiB
ops    = 1
gate   = ["disk"]
reference = { disk-per-byte = 1.00 }
expect = { exit = 0, stdout = "kernel/write-big-b.expect" }
measure = ["wall", "rss", "tin-growth", "disk-per-byte", "fsyncs-per-op", "file:$CIGSCRIPT_HOME/work/big.bin"]

[[case]]
name   = "restore big file"
group  = "kernel"
run    = ["cig", "unburn", "--last", "1", "-y"]
before = [
  ["cig", "run", "kernel/write-big.cig", "--", "a"],
  ["cig", "run", "kernel/write-big.cig", "--", "b"],
]
per    = 1
ops    = 1
after  = ["cig", "run", "kernel/check-big.cig"]
expect = { exit = 0, after_stdout = "kernel/check-big.expect" }
measure = ["wall", "rss", "tin-growth", "fsyncs-per-op", "file:$CIGSCRIPT_HOME/work/big.bin"]

[[case]]
name   = "hop, 2,000 files unchanged"
group  = "kernel"
run    = ["cig", "run", "kernel/hop.cig"]
before = [
  ["cig", "run", "kernel/make-hop-tree.cig"],
  ["cig", "run", "kernel/hop.cig"],
]
per    = 1
ops    = 1
expect = { exit = 0, stdout = "kernel/hop.expect" }
measure = ["wall", "rss", "tin-growth", "fsyncs-per-op"]
