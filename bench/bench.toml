# cig's own benchmark suite (#145, #179 step 5). Run it from the repository
# root:  cig bench bench/bench.toml   (see docs/BENCH.md, "cig's own suite").
#
# - start-up and compute: the programs of cigcompile's set, each checked
#   against its .expect file before any time is shown;
# - kernel: what a burn, an unburn, a restore and a hop cost, with the kernel
#   measures reported next to the time.
#
# Gates (#145; `cig bench --gate LIST`): every case is under `correctness`.
# `start-up` cases carry a `budget`, `disk` cases a `reference` (main's bytes
# per byte burned). CI fails a pull request on `correctness` and `disk` only;
# the timing gates are printed (#153).
#
# Every case runs against a scratch home. The kernel scripts write only
# under $CIGSCRIPT_HOME/work, so nothing lands in this folder.

format = 1

[bench]
product = "cig"
version = ["cig", "--version"]
home    = "isolated"
build   = ["cargo", "build", "--release"]
binary  = "target/release/cig"
watch   = ["src/**", "crates/**", "Cargo.toml", "bench/**"]

[defaults]
samples = 5
per     = 1
warmup  = 1
env     = { NO_COLOR = "1", CIG_DOCTOR = "0", CIG_SEAL_KEY = "file" }

[[case]]
name   = "hello"
group  = "start-up"
run    = ["cig", "run", "compute/hello.cig"]
per    = 20
budget = "5 ms"         # #145's start-up gate; reported on shared runners, never failed (#153)
gate   = ["start-up"]
expect = { exit = 0, stdout = "compute/hello.expect" }

[[case]]
name   = "startup-0"
group  = "start-up"
run    = ["cig", "run", "compute/startup-0.cig"]
per    = 20
expect = { exit = 0, stdout = "compute/startup-0.expect" }

[[case]]
name   = "startup-1"
group  = "start-up"
run    = ["cig", "run", "compute/startup-1.cig"]
per    = 20
expect = { exit = 0, stdout = "compute/startup-1.expect" }

[[case]]
name   = "startup-10"
group  = "start-up"
run    = ["cig", "run", "compute/startup-10.cig"]
per    = 20
expect = { exit = 0, stdout = "compute/startup-10.expect" }

[[case]]
name   = "burn one write"
group  = "start-up"
run    = ["cig", "run", "kernel/burn-one.cig"]
per    = 1             # a fresh home each run: the file is always new
budget = "7 ms"        # #145's start-up gate for a one-write burn
gate   = ["start-up"]
expect = { exit = 0, stdout = "kernel/burn-one.expect" }

