[package]
name = "cig-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "cig-vault: a no-delete store for the tin's objects, run as its own account"
license = "FSL-1.1-ALv2"
repository = "https://github.com/otmof-ops/cig-script"
readme = "README.md"
keywords = ["backup", "content-addressed", "rollback"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "cig_vault"
path = "src/lib.rs"

[[bin]]
name = "cig-vault"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
