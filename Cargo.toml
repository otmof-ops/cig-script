[package]
name = "cigscript"
version = "1.21.0"
edition = "2021"
rust-version = "1.82"
description = "CigScript: a small scripting language where nothing real happens unless you burn"
license = "FSL-1.1-ALv2"
repository = "https://github.com/otmof-ops/cig-script"
readme = "README.md"
keywords = ["scripting", "language", "automation", "rollback", "dry-run"]
categories = ["command-line-utilities", "development-tools"]
default-run = "cig"

[workspace]
members = [".", "crates/cig-pass", "crates/cig-vault"]
exclude = ["crates/cig-pass/fuzz"]

[lib]
name = "cigscript"
path = "src/lib.rs"

[[bin]]
name = "cig"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
memchr = "2"
globset = "0.4"
walkdir = "2"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
wait-timeout = "0.2"
toml = { version = "0.8", default-features = false, features = ["parse"] }
fastcdc = { version = "3", default-features = false }
chacha20poly1305 = { version = "0.10", features = ["stream", "getrandom"] }
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
tar = "0.4"
flate2 = "1"
cig-pass = { path = "crates/cig-pass", version = "0.1.0" }
blake3 = { version = "1", features = ["pure"] }
zstd = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
cig-vault = { path = "crates/cig-vault", version = "0.1.0" }

# The static musl build's own allocator makes every allocation-heavy script 2
# to 5x slower than the same code on glibc (cig-script#146), so musl alone
# links mimalloc. Every other target keeps the system allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
# Job Objects: a hop's whole process tree ends with the hop on Windows.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"

[features]
# A counting allocator for `cig bench --stats` and `cig run --stats` (#179).
# Off by default and never on in a release.
bench-stats = []

[profile.release]
codegen-units = 1
lto = true
# Symbol names stay so a crash report's backtrace names the function (#23);
# only the DWARF line tables go.
strip = "debuginfo"
